<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2'><circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 3'/></svg>" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- 纯正 macOS 动态深空壁纸与次表层光影折射 -->
  <div class="wallpaper-substrate">
    <div class="aurora-beam beam-1"></div>
    <div class="aurora-beam beam-2"></div>
    <div class="ambient-vignette"></div>
  </div>

  <div class="stage-container">
    
    <!-- 顶部状态锚点：极其克制的 SF 状态 -->
    <header class="macos-menubar">
      <div class="status-date" id="liveDate">10月4日 星期日</div>
    </header>

    <!-- 中心主区域 -->
    <main class="macos-center-stage">
      
      <!-- Apple 原生大时钟：Ultralight 呼吸感排印 -->
      <section class="time-container">
        <div class="time-clock" id="liveClock">02:18</div>
      </section>

      <!-- macOS Spotlight 搜索胶囊 -->
      <section class="spotlight-wrapper">
        <form id="spotlightForm" class="spotlight-bar" role="search">
          
          <!-- 引擎切换器 (微质感玻璃药丸) -->
          <button type="button" class="spotlight-engine-pill" id="engineBtn" title="切换搜索引擎 (快捷键: Tab)">
            <img id="engineIcon" src="https://www.google.com/favicon.ico" alt="" />
            <span id="engineLabel">Google</span>
            <svg class="chevron-svg" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>

          <!-- 引擎弹出菜单 (macOS 晶莹浮动面板) -->
          <div class="spotlight-menu" id="engineMenu">
            <div class="menu-item active" data-url="https://www.google.com/search?q=" data-name="Google" data-icon="https://www.google.com/favicon.ico">
              <img src="https://www.google.com/favicon.ico" alt="" />
              <span>Google</span>
              <kbd class="menu-kbd">1</kbd>
            </div>
            <div class="menu-item" data-url="https://github.com/search?q=" data-name="GitHub" data-icon="https://github.githubassets.com/favicons/favicon.svg">
              <img src="https://github.githubassets.com/favicons/favicon.svg" alt="" />
              <span>GitHub</span>
              <kbd class="menu-kbd">2</kbd>
            </div>
            <div class="menu-item" data-url="https://www.bing.com/search?q=" data-name="Bing" data-icon="https://www.bing.com/favicon.ico">
              <img src="https://www.bing.com/favicon.ico" alt="" />
              <span>Bing</span>
              <kbd class="menu-kbd">3</kbd>
            </div>
            <div class="menu-item" data-url="https://search.bilibili.com/all?keyword=" data-name="Bilibili" data-icon="https://www.bilibili.com/favicon.ico">
              <img src="https://www.bilibili.com/favicon.ico" alt="" />
              <span>Bilibili</span>
              <kbd class="menu-kbd">4</kbd>
            </div>
            <div class="menu-item" data-url="https://www.baidu.com/s?wd=" data-name="百度" data-icon="https://www.baidu.com/favicon.ico">
              <img src="https://www.baidu.com/favicon.ico" alt="" />
              <span>百度</span>
              <kbd class="menu-kbd">5</kbd>
            </div>
          </div>

          <!-- 搜索输入框 -->
          <input
            type="text"
            id="spotlightInput"
            class="spotlight-input"
            placeholder="聚焦搜索或输入网址..."
            autocomplete="off"
            spellcheck="false"
            autofocus
          />

          <!-- 尾部操作与快捷键提示 -->
          <div class="spotlight-trailing">
            <kbd class="spotlight-shortcut" id="tabHint">Tab 引擎</kbd>
            <button type="submit" class="spotlight-go-btn" aria-label="搜索">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>

        </form>
      </section>

      <!-- macOS Launchpad 级精致常用应用 Dock -->
      <section class="dock-cluster">
        <div class="dock-shelf" id="dockShelf">
          <!-- 动态渲染 Squircle 图标与光泽 -->
        </div>
      </section>

    </main>

    <!-- 底部状态与快捷键提示 -->
    <footer class="macos-footer">
      <div class="footer-legend">
        <span><kbd>Space</kbd> 或 <kbd>/</kbd> 聚焦</span>
        <span class="legend-dot">•</span>
        <span><kbd>Tab</kbd> 换源</span>
        <span class="legend-dot">•</span>
        <span>回车直达</span>
      </div>
    </footer>

  </div>

  <!-- 添加快捷方式 Sheet 模态窗 (iOS/macOS Sheet 规范) -->
  <div class="macos-sheet-scrim" id="sheetScrim">
    <div class="macos-sheet">
      <div class="sheet-header">
        <h3>添加常用站点</h3>
        <button class="sheet-close" id="sheetCloseBtn" type="button">✕</button>
      </div>
      <form id="sheetForm">
        <div class="sheet-input-group">
          <label>站点名称</label>
          <input type="text" id="siteTitleInput" placeholder="例如: Linear" required autocomplete="off" />
        </div>
        <div class="sheet-input-group">
          <label>网址 URL</label>
          <input type="text" id="siteUrlInput" placeholder="https://linear.app" required autocomplete="off" />
        </div>
        <div class="sheet-actions">
          <button type="button" class="btn-macos-secondary" id="sheetCancelBtn">取消</button>
          <button type="submit" class="btn-macos-primary">添加</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
