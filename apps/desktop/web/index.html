<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>OpenPI</title>
		<style>
			:root {
				color-scheme: light dark;
				background-color: transparent !important;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background: transparent !important;
				overflow: hidden;
				-webkit-font-smoothing: antialiased;
				font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
			}
			#root {
				width: 100%;
				height: 100%;
				background: transparent;
			}
		</style>
		<script>
			if (typeof navigator !== "undefined" && /Macintosh|Mac OS X/i.test(navigator.userAgent)) {
				document.documentElement.classList.add("platform-darwin");
			}
			try {
				const theme = localStorage.getItem("openpi-theme") || "dark";
				const isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				const effectiveMode = isDark ? "dark" : "light";
				const flavor = localStorage.getItem("openpi-theme-flavor") || (isDark ? "dark-default" : "light-default");
				document.documentElement.setAttribute("data-theme", effectiveMode);
				document.documentElement.setAttribute("data-theme-flavor", flavor);
				if (isDark) {
					document.documentElement.classList.add("dark");
					document.documentElement.classList.remove("light");
				} else {
					document.documentElement.classList.add("light");
					document.documentElement.classList.remove("dark");
				}
			} catch (_) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/main.tsx"></script>
	</body>
</html>
