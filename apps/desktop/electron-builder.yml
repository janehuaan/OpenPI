appId: works.earendil.openpi
productName: OpenPI

directories:
  output: release
  buildResources: build

# The renderer bundle, the compiled main process, and package.json. The runtime
# is copied in afterPack instead: electron-builder ignores `**/node_modules` by
# default, and runtime/ deliberately contains one.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraMetadata:
  main: dist-electron/main.js

afterPack: scripts/after-pack.mjs

mac:
  category: public.app-category.developer-tools
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: OpenPI
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: OpenPI
  uninstallDisplayName: OpenPI

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  synopsis: OpenPI desktop personal agent
  description: OpenPI desktop personal agent built on Pi
