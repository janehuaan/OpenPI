name: Release macOS Tauri Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build (${{ matrix.arch }})
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-apple-darwin
          - arch: arm64
            rust_target: aarch64-apple-darwin

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Add Rust cross-compile target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build and package complete Tauri app
        env:
          CARGO_TARGET: ${{ matrix.rust_target }}
        run: bash scripts/package-tauri-app.sh

      - name: Upload verified app archive
        uses: actions/upload-artifact@v4
        with:
          name: openpi-macos-${{ matrix.arch }}
          path: target/${{ matrix.rust_target }}/release/bundle/OpenPI_*.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Download app archives
        uses: actions/download-artifact@v4
        with:
          pattern: openpi-macos-*
          path: all-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd all-assets
          test -f OpenPI_*_x86_64.zip
          test -f OpenPI_*_arm64.zip
          sha256sum -- *.zip > SHA256SUMS
          ls -lh

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          IS_DRAFT: ${{ github.event.inputs.draft == 'true' }}
          IS_PRERELEASE: ${{ github.event.inputs.prerelease == 'true' }}
        run: |
          set -euo pipefail
          cd all-assets
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber ./*.zip SHA256SUMS
          else
            flags=()
            if [[ "$IS_DRAFT" == true ]]; then flags+=(--draft); fi
            if [[ "$IS_PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS \
              --verify-tag --title "OpenPI $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
