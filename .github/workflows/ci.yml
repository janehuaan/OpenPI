name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check & Test (macOS)
    runs-on: macos-15
    env:
      # Treat compiler warnings as errors for workspace crates. Cargo caps lints
      # for registry dependencies, so this only gates our own code. The workspace
      # is warning-clean, so a new warning fails CI instead of accumulating.
      RUSTFLAGS: "-D warnings"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Typecheck
        run: yarn typecheck

      - name: Test Rust workspace and desktop web app
        run: yarn test

      - name: Clippy (warnings as errors)
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings

      # The host build never compiles the other architecture's `cfg` branches, so
      # a break in one of them only shows up on a differently-architected runner.
      # Check the non-host target explicitly instead of relying on runner luck.
      - name: Check the other macOS target (cfg-gated code)
        run: bash scripts/check-targets.sh

      - name: Build desktop web app and check Tauri crate
        run: |
          yarn build
          cargo check --locked -p openpi-desktop -p openpi-daemon
