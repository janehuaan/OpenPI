name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check & Test (macOS)
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Typecheck
        run: yarn typecheck

      - name: Test Rust workspace and desktop web app
        run: yarn test

      - name: Build desktop web app and check Tauri crate
        run: |
          yarn build
          cargo check --locked -p openpi-desktop -p openpi-daemon
