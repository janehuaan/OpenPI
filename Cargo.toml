[workspace]
members = [
    "crates/openpi-proto",
    "crates/openpi-storage",
    "crates/openpi-scheduler",
    "crates/openpi-memory",
    "crates/openpi-state",
    "crates/openpi-tools",
    "crates/openpi-daemon",
    "crates/openpi-jev",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OpenPI Contributors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
futures-util = "0.3"
base64 = "0.22"
