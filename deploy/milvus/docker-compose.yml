services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: openpi-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - openpi-milvus-etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    container_name: openpi-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - openpi-milvus-minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: openpi-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - no-new-privileges:true
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - openpi-milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  openpi-milvus-etcd:
    name: openpi-milvus-etcd
  openpi-milvus-minio:
    name: openpi-milvus-minio
  openpi-milvus-data:
    name: openpi-milvus-data
