<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="八组中国古典配色在同一产品界面中的应用对比。" />
  <title>观色 · 中国古典配色实验室</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f5;
      --surface: #ffffff;
      --surface-soft: #e8eeeb;
      --surface-strong: #dce7e4;
      --text: #243337;
      --muted: #657477;
      --border: #d5ddda;
      --primary: #354a4f;
      --primary-contrast: #ffffff;
      --accent: #c53d32;
      --accent-soft: #f2dcd8;
      --support: #577568;
      --gold: #c49336;
      --shadow: rgba(36, 51, 55, 0.1);
      --focus: rgba(197, 61, 50, 0.26);
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
      transition: color 260ms ease, background-color 260ms ease;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }

    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border-right: 1px solid var(--border);
      transition: background-color 260ms ease, border-color 260ms ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 76px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      color: var(--primary-contrast);
      background: var(--primary);
      border-radius: 8px;
      font-family: "Songti SC", "STSong", serif;
      font-size: 22px;
      font-weight: 700;
      transition: color 260ms ease, background-color 260ms ease;
    }

    .brand-name { font-size: 16px; font-weight: 760; }
    .brand-subtitle { margin-top: 2px; color: var(--muted); font-size: 11px; }

    .theme-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .theme-count {
      padding: 2px 7px;
      color: var(--primary);
      background: var(--surface-soft);
      border-radius: 999px;
    }

    .theme-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 0 10px 18px;
      overflow-y: auto;
    }

    .theme-button {
      width: 100%;
      min-height: 58px;
      display: grid;
      grid-template-columns: 5px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 7px 10px 7px 5px;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .theme-button:hover { background: var(--surface-soft); }
    .theme-button:active { transform: scale(0.985); }
    .theme-button.active { background: var(--surface-soft); border-color: var(--border); }

    .active-rail {
      width: 3px;
      height: 28px;
      background: transparent;
      border-radius: 2px;
    }

    .theme-button.active .active-rail { background: var(--accent); }
    .theme-title { display: block; font-size: 13px; font-weight: 680; }
    .theme-era { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }

    .mini-swatches { display: flex; gap: 3px; }
    .mini-swatches i {
      display: block;
      width: 13px;
      height: 26px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 3px;
    }

    .sidebar-note {
      margin-top: auto;
      padding: 14px 20px 18px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 10px;
      line-height: 1.6;
    }

    .workspace { min-width: 0; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px clamp(20px, 3vw, 42px);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px) saturate(140%);
    }

    .search {
      position: relative;
      width: min(420px, 44vw);
    }

    .search-symbol {
      position: absolute;
      left: 13px;
      top: 50%;
      translate: 0 -50%;
      color: var(--muted);
      font-size: 16px;
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 38px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
    }

    .search input::placeholder { color: var(--muted); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

    .icon-button {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
    }

    .icon-button:hover { color: var(--accent); border-color: var(--accent); }

    .avatar {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      margin-left: 4px;
      color: var(--primary-contrast);
      background: var(--primary);
      border-radius: 50%;
      font-family: "Songti SC", "STSong", serif;
      font-weight: 700;
    }

    .main-content {
      width: min(1220px, 100%);
      margin: 0 auto;
      padding: 30px clamp(20px, 3vw, 42px) 46px;
    }

    .theme-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 24px;
      padding-bottom: 26px;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
      line-height: 1.18;
    }

    .intro-copy {
      max-width: 660px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .primary-button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 17px;
      color: var(--primary-contrast);
      background: var(--primary);
      border: 0;
      border-radius: 7px;
      box-shadow: 0 8px 18px var(--shadow);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .primary-button:hover { background: var(--accent); }
    .primary-button:active { transform: scale(0.98); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-block: 1px solid var(--border);
    }

    .metric { min-width: 0; padding: 20px 22px; border-right: 1px solid var(--border); }
    .metric:first-child { padding-left: 0; }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--muted); font-size: 11px; }
    .metric-value { margin-top: 8px; font-size: 26px; font-weight: 760; }
    .metric-trend { margin-left: 7px; color: var(--support); font-size: 10px; font-weight: 700; }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.75fr);
      gap: 24px;
      padding-top: 24px;
    }

    .panel {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 12px 30px var(--shadow);
      transition: background-color 260ms ease, border-color 260ms ease, box-shadow 260ms ease;
    }

    .panel-header {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title { font-size: 14px; font-weight: 760; }
    .panel-meta { margin-top: 3px; color: var(--muted); font-size: 10px; }

    .segmented {
      display: flex;
      padding: 3px;
      background: var(--surface-soft);
      border-radius: 6px;
    }

    .segment {
      min-width: 50px;
      height: 28px;
      padding: 0 10px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
    }

    .segment.active { color: var(--text); background: var(--surface); box-shadow: 0 2px 8px var(--shadow); }

    .chart-area {
      height: 248px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 20px 14px;
    }

    .chart-summary { display: flex; align-items: baseline; gap: 9px; }
    .chart-total { font-size: 24px; font-weight: 760; }
    .chart-caption { color: var(--muted); font-size: 10px; }

    .bars {
      height: 148px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      align-items: end;
      gap: 8px;
      padding-top: 12px;
      border-bottom: 1px solid var(--border);
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 36px, var(--border) 37px);
    }

    .bar {
      min-height: 10px;
      background: var(--surface-strong);
      border-radius: 3px 3px 0 0;
      transition: height 350ms ease, background-color 260ms ease;
    }

    .bar:nth-child(3n) { background: var(--primary); }
    .bar:nth-child(7) { background: var(--accent); }
    .bar:hover { background: var(--gold); }

    .chart-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; }

    .task-list { padding: 4px 18px 12px; }
    .task-row {
      min-height: 58px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .task-row:last-child { border-bottom: 0; }

    .task-check {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .task-name { font-size: 12px; font-weight: 650; }
    .task-detail { margin-top: 3px; color: var(--muted); font-size: 9px; }

    .tag {
      padding: 4px 8px;
      color: var(--support);
      background: color-mix(in srgb, var(--support) 13%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--support) 24%, var(--border));
      border-radius: 999px;
      font-size: 9px;
      font-weight: 700;
    }

    .palette-panel { overflow: hidden; }
    .large-swatches { display: grid; grid-template-columns: repeat(5, 1fr); height: 106px; }
    .large-swatch { position: relative; cursor: pointer; }
    .large-swatch::after {
      content: attr(data-short);
      position: absolute;
      left: 50%;
      bottom: 9px;
      translate: -50% 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: 8px;
      font-weight: 750;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 140ms ease;
    }
    .large-swatch:hover::after { opacity: 1; }

    .color-list { padding: 8px 18px 12px; }
    .color-row {
      width: 100%;
      min-height: 44px;
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 0;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .color-row:last-child { border-bottom: 0; }
    .color-dot { width: 10px; height: 10px; border-radius: 50%; }
    .color-name { font-size: 11px; font-weight: 650; }
    .color-hex { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; }
    .color-row:hover .color-hex { color: var(--accent); }

    .composer { margin-top: 24px; }
    .composer-body { padding: 16px 18px; }
    .composer textarea {
      width: 100%;
      min-height: 76px;
      resize: vertical;
      padding: 12px 13px;
      color: var(--text);
      background: var(--surface-soft);
      border: 1px solid transparent;
      border-radius: 6px;
      line-height: 1.6;
    }
    .composer textarea:focus { background: var(--surface); border-color: var(--accent); }
    .composer-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .composer-hint { color: var(--muted); font-size: 9px; }
    .composer-actions .primary-button { min-height: 36px; margin-left: auto; padding-inline: 14px; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 40;
      padding: 10px 14px;
      color: var(--primary-contrast);
      background: var(--primary);
      border-radius: 6px;
      box-shadow: 0 10px 28px var(--shadow);
      font-size: 11px;
      opacity: 0;
      translate: 0 10px;
      pointer-events: none;
      transition: opacity 180ms ease, translate 180ms ease;
    }
    .toast.show { opacity: 1; translate: 0 0; }

    @media (max-width: 920px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: relative; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
      .brand { min-height: 66px; }
      .theme-heading { padding-top: 12px; }
      .theme-list { flex-direction: row; overflow-x: auto; padding-bottom: 12px; }
      .theme-button { min-width: 198px; }
      .sidebar-note { display: none; }
      .topbar { top: 0; min-height: 62px; }
      .content-grid { grid-template-columns: 1fr; }
      .palette-panel { order: -1; }
    }

    @media (max-width: 640px) {
      .topbar { padding-inline: 16px; }
      .search { width: 100%; }
      .topbar-actions .icon-button { display: none; }
      .avatar { flex: 0 0 auto; }
      .main-content { padding: 24px 16px 34px; }
      .theme-intro { grid-template-columns: 1fr; align-items: start; }
      .theme-intro .primary-button { width: 100%; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric { padding: 16px 12px; border-bottom: 1px solid var(--border); }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(3), .metric:nth-child(4) { border-bottom: 0; }
      .metric:nth-child(3) { padding-left: 0; }
      .metric-value { font-size: 22px; }
      .content-grid { gap: 16px; padding-top: 16px; }
      .composer { margin-top: 16px; }
      .bars { gap: 4px; }
      .panel-header { padding-inline: 14px; }
      .task-list, .color-list { padding-inline: 14px; }
      .toast { right: 16px; bottom: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="配色选择">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">色</div>
        <div>
          <div class="brand-name">观色</div>
          <div class="brand-subtitle">中国古典配色实验室</div>
        </div>
      </div>
      <div class="theme-heading">
        <span>八组主题</span>
        <span class="theme-count">16</span>
      </div>
      <div class="theme-list" id="themeList"></div>
      <div class="sidebar-note">同一界面、同一层级、同一内容。仅切换颜色系统，观察它们在真实产品中的表现。</div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <label class="search">
          <span class="search-symbol" aria-hidden="true">⌕</span>
          <input type="search" placeholder="搜索项目、笔记或任务" aria-label="搜索" />
        </label>
        <div class="topbar-actions">
          <button class="icon-button" type="button" title="通知" aria-label="通知">◌</button>
          <button class="icon-button" type="button" title="设置" aria-label="设置">⚙</button>
          <div class="avatar" title="个人账户">观</div>
        </div>
      </header>

      <main class="main-content">
        <section class="theme-intro" aria-labelledby="themeName">
          <div>
            <div class="eyebrow" id="themeMood">清雅 · 克制 · 文人气</div>
            <h1 id="themeName">月白 · 黛青 · 朱砂</h1>
            <p class="intro-copy" id="themeDescription">月白铺底，黛青立骨，朱砂点睛。适合生产力工具、知识管理与需要长期使用的桌面应用。</p>
          </div>
          <button class="primary-button" type="button" id="applyButton"><span aria-hidden="true">＋</span> 新建任务</button>
        </section>

        <section class="metrics" aria-label="今日概览">
          <div class="metric"><div class="metric-label">今日完成</div><div class="metric-value">12<span class="metric-trend">↑ 18%</span></div></div>
          <div class="metric"><div class="metric-label">专注时间</div><div class="metric-value">4.6<span class="metric-trend">小时</span></div></div>
          <div class="metric"><div class="metric-label">知识条目</div><div class="metric-value">286<span class="metric-trend">+7</span></div></div>
          <div class="metric"><div class="metric-label">连续记录</div><div class="metric-value">24<span class="metric-trend">天</span></div></div>
        </section>

        <div class="content-grid">
          <div>
            <section class="panel" aria-labelledby="activityTitle">
              <div class="panel-header">
                <div><div class="panel-title" id="activityTitle">创作活跃度</div><div class="panel-meta">最近十二个月的有效产出</div></div>
                <div class="segmented" role="group" aria-label="时间范围">
                  <button class="segment" type="button">周</button>
                  <button class="segment active" type="button">月</button>
                  <button class="segment" type="button">年</button>
                </div>
              </div>
              <div class="chart-area">
                <div class="chart-summary"><span class="chart-total">1,284</span><span class="chart-caption">条记录与任务</span></div>
                <div class="bars" aria-label="月度活跃度柱状图">
                  <i class="bar" style="height: 31%"></i><i class="bar" style="height: 46%"></i><i class="bar" style="height: 55%"></i><i class="bar" style="height: 42%"></i><i class="bar" style="height: 68%"></i><i class="bar" style="height: 61%"></i><i class="bar" style="height: 88%"></i><i class="bar" style="height: 72%"></i><i class="bar" style="height: 78%"></i><i class="bar" style="height: 64%"></i><i class="bar" style="height: 82%"></i><i class="bar" style="height: 96%"></i>
                </div>
                <div class="chart-labels"><span>八月</span><span>十一月</span><span>二月</span><span>五月</span><span>七月</span></div>
              </div>
            </section>

            <section class="panel composer" aria-labelledby="taskTitle">
              <div class="panel-header"><div><div class="panel-title" id="taskTitle">今日要事</div><div class="panel-meta">保持克制，只留下真正重要的事情</div></div><span class="tag">3 项进行中</span></div>
              <div class="task-list">
                <label class="task-row"><input class="task-check" type="checkbox" checked /><span><span class="task-name">整理产品设计规范</span><span class="task-detail">OpenPI Desktop · 上午 10:30</span></span><span class="tag">已完成</span></label>
                <label class="task-row"><input class="task-check" type="checkbox" /><span><span class="task-name">审阅微信桥接交互流程</span><span class="task-detail">协作项目 · 下午 14:00</span></span><span class="tag">进行中</span></label>
                <label class="task-row"><input class="task-check" type="checkbox" /><span><span class="task-name">完善个人智能体记忆策略</span><span class="task-detail">研究任务 · 今天</span></span><span class="tag">待处理</span></label>
              </div>
              <div class="composer-body">
                <textarea aria-label="快速记录" placeholder="写下一条想法，或让智能体处理一项任务……"></textarea>
                <div class="composer-actions"><span class="composer-hint">支持自然语言任务与 Markdown</span><button class="primary-button" type="button">发送 <span aria-hidden="true">↗</span></button></div>
              </div>
            </section>
          </div>

          <aside class="panel palette-panel" aria-labelledby="paletteTitle">
            <div class="panel-header"><div><div class="panel-title" id="paletteTitle">当前色谱</div><div class="panel-meta">点击颜色复制 HEX 色值</div></div><span class="tag" id="paletteTag">宋韵</span></div>
            <div class="large-swatches" id="largeSwatches"></div>
            <div class="color-list" id="colorList"></div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">已复制色值</div>

  <script>
    const themes = [
      {
        id: "moon",
        name: "月白 · 黛青 · 朱砂",
        era: "宋韵",
        mood: "清雅 · 克制 · 文人气",

    const themeList = document.getElementById("themeList");
    const largeSwatches = document.getElementById("largeSwatches");
    const colorList = document.getElementById("colorList");
    const toast = document.getElementById("toast");
    let activeTheme = themes[0];
    let toastTimer;

    function renderThemeButtons() {
      themeList.innerHTML = themes.map((theme) => `
        <button class="theme-button ${theme.id === activeTheme.id ? "active" : ""}" type="button" data-theme="${theme.id}" aria-pressed="${theme.id === activeTheme.id}">
          <span class="active-rail" aria-hidden="true"></span>
          <span><span class="theme-title">${theme.name}</span><span class="theme-era">${theme.era} · ${theme.mood.split(" · ")[0]}</span></span>
          <span class="mini-swatches" aria-hidden="true">${theme.colors.slice(1, 5).map((color) => `<i style="background:${color[1]}"></i>`).join("")}</span>
        </button>
      `).join("");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1500);
    }

    async function copyColor(hex, name) {
      try {
        await navigator.clipboard.writeText(hex);
      } catch {
        const input = document.createElement("textarea");
        input.value = hex;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }
      showToast(`已复制 ${name} ${hex}`);
    }

    function renderPalette(theme) {
      largeSwatches.innerHTML = theme.colors.map(([name, hex]) => `<button class="large-swatch" type="button" style="background:${hex};border:0" data-hex="${hex}" data-name="${name}" data-short="${name}" title="复制 ${name} ${hex}" aria-label="复制 ${name} ${hex}"></button>`).join("");
      colorList.innerHTML = theme.colors.map(([name, hex]) => `
        <button class="color-row" type="button" data-hex="${hex}" data-name="${name}">
          <i class="color-dot" style="background:${hex};border:1px solid color-mix(in srgb, ${hex} 70%, #777)"></i>
          <span class="color-name">${name}</span>
          <span class="color-hex">${hex}</span>
        </button>
      `).join("");
    }

    function applyTheme(id) {
      const theme = themes.find((item) => item.id === id);
      if (!theme) return;
      activeTheme = theme;
      const root = document.documentElement;
      const v = theme.vars;
      root.style.setProperty("--bg", v.bg);
      root.style.setProperty("--surface", v.surface);
      root.style.setProperty("--surface-soft", v.soft);
      root.style.setProperty("--surface-strong", v.strong);
      root.style.setProperty("--text", v.text);
      root.style.setProperty("--muted", v.muted);
      root.style.setProperty("--border", v.border);
      root.style.setProperty("--primary", v.primary);
      root.style.setProperty("--primary-contrast", v.contrast);
      root.style.setProperty("--accent", v.accent);
      root.style.setProperty("--accent-soft", v.accentSoft);
      root.style.setProperty("--support", v.support);
      root.style.setProperty("--gold", v.gold);
      root.style.setProperty("--shadow", v.shadow);
      root.style.setProperty("--focus", v.focus);
      root.style.colorScheme = theme.id === "night" ? "dark" : "light";
      document.getElementById("themeName").textContent = theme.name;
      document.getElementById("themeMood").textContent = theme.mood;
      document.getElementById("themeDescription").textContent = theme.description;
      document.getElementById("paletteTag").textContent = theme.era;
      renderThemeButtons();
      renderPalette(theme);
      window.localStorage.setItem("classical-color-theme", id);
    }

    themeList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-theme]");
      if (button) applyTheme(button.dataset.theme);
    });

    document.addEventListener("click", (event) => {
      const colorButton = event.target.closest("[data-hex]");
      if (colorButton) copyColor(colorButton.dataset.hex, colorButton.dataset.name);
    });

    document.querySelectorAll(".segment").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segment").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        document.querySelectorAll(".bar").forEach((bar) => {
          bar.style.height = `${24 + Math.round(Math.random() * 72)}%`;
        });
      });
    });

    document.getElementById("applyButton").addEventListener("click", () => showToast("已打开新建任务入口"));

    const requestedTheme = new URLSearchParams(window.location.search).get("theme");
    const savedTheme = window.localStorage.getItem("classical-color-theme");
    const initialTheme = themes.some((theme) => theme.id === requestedTheme) ? requestedTheme : savedTheme;
    applyTheme(themes.some((theme) => theme.id === initialTheme) ? initialTheme : "linen");
